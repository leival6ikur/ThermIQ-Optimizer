<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/thumbnail.svg?v=2" />
    <link rel="shortcut icon" type="image/svg+xml" href="/thumbnail.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Thermi-Nator</title>
    <meta name="title" content="Thermi-Nator - Heat Pump Optimizer" />
    <meta name="description" content="Smart heat pump optimizer for minimum electricity costs while maintaining comfort" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Thermi-Nator" />
    <link rel="apple-touch-icon" href="/thumbnail.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/thumbnail.svg?v=2" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/thumbnail.svg?v=2" />

    <script>
      // Initialize theme before React loads to prevent flash
      (function() {
        const theme = localStorage.getItem('theme') ||
                     (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
